name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build worker (Cloudflare)
        # Con env de placeholder — no hay secretos reales en Fase 5. Sirve para
        # medir el bundle del worker en Linux, ya que en Windows local
        # pnpm build:worker falla por EPERM de symlink (ver ADR 0003).
        run: pnpm build:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"

      - name: Gate — three.js y lenis fuera del worker
        # Ver docs/decisions/0003-motion-y-3d.md: three/R3F/lenis solo se cargan
        # client-side vía dynamic(ssr:false) desde src/components/immersive/*.
        # Si aparecen acá, algo se está importando fuera de esa frontera.
        run: |
          if grep -q "WebGLRenderer" .open-next/worker.js; then
            echo "three.js filtró al bundle del worker — revisar imports fuera de src/components/immersive/*" >&2
            exit 1
          fi
          if grep -qi "class Lenis" .open-next/worker.js; then
            echo "lenis filtró al bundle del worker — revisar imports fuera de src/lib/motion/*" >&2
            exit 1
          fi
          echo "OK: three.js y lenis no están en .open-next/worker.js"
