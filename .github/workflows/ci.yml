name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build no requiere DB real (igual que glamify); placeholders para que
          # next build no falle al importar m�dulos que leen el entorno.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          DATABASE_URL: postgresql://placeholder

      - name: Gate — three.js y lenis fuera del servidor
        # Ver docs/decisions/0003-motion-y-3d.md y 0005-deploy-en-vercel.md:
        # three/R3F/lenis solo se cargan client-side vía dynamic(ssr:false)
        # desde src/components/immersive/* y src/lib/motion/*. Si aparecen en
        # .next/server, algo se está importando fuera de esa frontera.
        # Marcadores elegidos porque sobreviven al minificado: `WebGLRenderer`
        # y `lenis-smooth` (clase CSS que Lenis agrega al <html>) aparecen en
        # .next/static. El marcador anterior de lenis ("class Lenis") no
        # aparecía ni en el chunk del cliente, así que ese gate nunca podía fallar.
        run: |
          if grep -rlq "WebGLRenderer" .next/server; then
            echo "three.js filtró al bundle del servidor — revisar imports fuera de src/components/immersive/*" >&2
            exit 1
          fi
          if grep -rlq "lenis-smooth" .next/server; then
            echo "lenis filtró al bundle del servidor — revisar imports fuera de src/lib/motion/*" >&2
            exit 1
          fi
          echo "OK: three.js y lenis no están en .next/server"
